name: Build and Deploy React Frontend (via Docker Compose)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. pnpm 환경 설정
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      # 2. Node.js 설정
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'

      # 3. pnpm으로 의존성 설치 및 빌드 (VITE_API_BASE_URL 환경변수 주입)
      - name: Install and Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          pnpm install
          pnpm run build

      # 4. 서버로 빌드 결과물(dist/)과 nginx.conf 파일을 함께 전송
      - name: Copy dist and nginx.conf to Gabia Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          source: "dist/,nginx.conf"
          target: "/home/ubuntu/frontend-app"

      # 5. 서버에서 Docker Compose 실행 (무중단 빌드 및 교체)
      - name: Restart Frontend Service on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          script: |
            cd /home/ubuntu/my-fastapi
            docker compose build frontend
            docker compose up -d --no-deps frontend
            docker image prune -f
