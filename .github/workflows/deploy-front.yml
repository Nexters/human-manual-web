name: Build and Deploy React Frontend (via Docker Compose)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. pnpm 환경 설정
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      # 2. Node.js 설정
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'

      # 3. pnpm으로 의존성 설치 및 빌드
      - name: Install and Build
        run: |
          pnpm install
          pnpm run build

      # 4. 서버로 빌드 결과물 전송 (dist 폴더만 전송)
      - name: Copy dist to Gabia Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          source: "dist/"
          target: "/home/ubuntu/frontend-app"

      # 5. 서버에서 Docker Compose 실행 (프론트엔드 컨테이너만 재시작)
      - name: Restart Frontend Service on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          script: |
            # 백엔드 프로젝트 폴더로 이동하여 실행
            cd /home/ubuntu/my-fastapi
            
            # 프론트엔드 서비스만 새로 빌드하고 실행
            docker compose up --build -d front
