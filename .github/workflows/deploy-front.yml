name: Build and Deploy React Frontend (via Docker Compose)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install and Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_ANALYTICS: ${{ secrets.VITE_GOOGLE_ANALYTICS }}
        run: |
          pnpm install
          pnpm run build

      - name: Copy dist and nginx.conf to Gabia Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          source: "dist/,nginx.conf"
          target: "/home/ubuntu/frontend-app"

      - name: Restart Frontend Service on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/my-fastapi
            docker compose build front
            docker compose up -d --no-deps front
            docker image prune -f
