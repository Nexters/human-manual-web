name: Build and Push React Frontend (pnpm)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. pnpm 환경 설정
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      # 2. Node.js 설정
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'

      # 3. pnpm으로 의존성 설치
      - name: Install dependencies
        run: pnpm install

      # 4. pnpm으로 리액트 빌드
      - name: Build React App
        run: pnpm run build
          
      # 5. 서버로 파일 전송 (SCP)
      - name: Copy files to Gabia Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          source: "dist/*,Dockerfile"
          target: "/home/ubuntu/frontend-app"

      # 6. 서버에서 도커 빌드 및 실행 (3000번 포트 매핑)
      - name: Build & Run Docker on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          script: |
            cd /home/ubuntu/frontend-app
            docker build -t my-frontend .
            docker stop my-frontend || true
            docker rm my-frontend || true
            docker run -d --name my-frontend -p 3000:80 my-frontend
