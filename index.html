    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=%VITE_GOOGLE_ANALYTICS%"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "%VITE_GOOGLE_ANALYTICS%");

    <!-- Meta Pixel. ID 는 브라우저 JS 에 그대로 노출되는 공개값이라 하드코딩한다.
         SPA 라우팅 전환 시의 PageView 는 AppLayout 에서 따로 보낸다. -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", "1578679130614973");
      fbq("track", "PageView");
    </script>
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=1578679130614973&ev=PageView&noscript=1"
    /></noscript>

    <meta

    />
    <meta property="og:site_name" content="Pakit" />
    <!-- og:url 을 고정하면 카카오톡 등에서 미리보기 카드를 눌렀을 때 공유한 결과지 링크가
         아니라 이 주소로 이동해버린다. 크롤러가 요청한 URL 을 그대로 쓰도록 비워둔다. -->
    <!-- 카카오톡은 HTML 과 이미지를 따로 캐싱한다. 같은 파일명으로 이미지만 갈아끼우면
         캐시 초기화를 해도 옛날 이미지가 계속 나간다. 카드를 바꿀 때는 반드시
         파일명(-v3, -v4 …)도 같이 올려 URL 을 새로 만들 것. -->
    <meta property="og:image" content="https://pakit.kr/og-main-v2.jpg" />
